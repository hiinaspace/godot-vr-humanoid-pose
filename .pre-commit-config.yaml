default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ty-check
        name: ty check
        entry: uv run ty check validation tests --no-progress
        language: system
        pass_filenames: false
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: persona-lint
        name: persona-lint (gitleaks + private denylist)
        entry: |-
          sh -c 'if command -v persona-lint >/dev/null; then exec persona-lint "$@"; elif [ -d "$HOME/org" ]; then echo "persona-lint missing; reinstall via the tools dir in ~/org (see the install flag there)" >&2; exit 1; fi' --
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: persona-lint-msg
        name: persona-lint (commit message)
        entry: |-
          sh -c 'if command -v persona-lint >/dev/null; then exec persona-lint "$@"; elif [ -d "$HOME/org" ]; then echo "persona-lint missing; reinstall via the tools dir in ~/org (see the install flag there)" >&2; exit 1; fi' -- --msg
        language: system
        pass_filenames: true
        stages: [commit-msg]
