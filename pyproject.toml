[project]
name = "godot-vr-humanoid-pose"
version = "0.1.0"
description = "Validation and pose-estimation scaffolding for sparse VR humanoid tracking in Godot."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "polars>=1.40.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.1a31",
]
ml = [
    "mlflow>=3.0.0",
    "numpy>=2.4.6",
    "torch==2.12.0+cu130",
    "xgboost>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [
    ".cache",
    "validation/cmu_manifest.json",
    "validation/data",
    "validation/reports",
    "validation/rendered",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.ty]
